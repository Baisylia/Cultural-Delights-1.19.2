plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.137'
}

version = project.version
group = project.group

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }

    exclusiveContent {
        forRepositories(
                maven {
                    name = 'ParchmentMC'
                    url = 'https://maven.parchmentmc.org/'
                },
                maven {
                    name = "NeoForge"
                    url = 'https://maven.neoforged.net/releases'
                }
        )
        filter { includeGroup('org.parchmentmc.data') }
    }

    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                name = "BlameJared"
                url = "https://maven.blamejared.com"
            }
        }
        filter {
            includeGroup "mezz.jei"
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                name = "MehVahdJukaar"
                url = "https://maven.mehvahdjukaar.com"
            }
        }
        filter {
            includeGroup "net.mehvahdjukaar"
        }
    }
}

neoForge {
    version = neoforge_version

    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()}"
        }
        client {
            client()
        }
        server {
            server()
            programArguments.addAll '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    // Farmer's Delight
    compileOnly "maven.modrinth:farmers-delight:${farmers_delight_version}"
    runtimeOnly "maven.modrinth:farmers-delight:${farmers_delight_version}"

    // Cook's Collection
    compileOnly "maven.modrinth:cooks-collection:${cooks_collection_version}"
    runtimeOnly "maven.modrinth:cooks-collection:${cooks_collection_version}"

    // Supplementaries
    compileOnly "maven.modrinth:supplementaries:${supplementaries_version}"
    runtimeOnly "maven.modrinth:supplementaries:${supplementaries_version}"
    compileOnly "maven.modrinth:moonlight:uPJlV3eS"
    runtimeOnly "maven.modrinth:moonlight:uPJlV3eS"

    // EMI
    compileOnly "maven.modrinth:emi:${emi_version}+neoforge"
    runtimeOnly "maven.modrinth:emi:${emi_version}+neoforge"

    // JEI
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${jei_version}"
    //runtimeOnly "mezz.jei:jei-1.21.1-neoforge:${jei_version}"

    // AppleSkin
    compileOnly "maven.modrinth:appleskin:${appleskin_version}"
    runtimeOnly "maven.modrinth:appleskin:${appleskin_version}"
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
            'version'                      : version,
            'group'                        : project.group,
            'minecraft_version'            : minecraft_version,
            'minecraft_version_range'      : minecraft_version_range,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'description'                  : project.description,
            'neoforge_version'             : neoforge_version,
            'neoforge_loader_version_range': neoforge_loader_version_range,
            'credits'                      : credits,
            'java_version'                 : java_version,
    ]

    filesMatching(['pack.mcmeta', 'META-INF/neoforge.mods.toml']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
